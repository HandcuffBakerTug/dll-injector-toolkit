[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dll-injector-toolkit"
version = "0.6.2"
description = "Pipeline-style Windows DLL injector toolkit — handlers in, processors chew, drivers report."
readme = "CONTRIBUTING.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "dll-injector-toolkit maintainers" }]
keywords = ["dll", "injector", "windows", "winapi", "reverse-engineering"]
dependencies = [
    "pywin32>=306; sys_platform == 'win32'",
    "pefile>=2023.2.7",
    "pydantic>=2.6",
    "tomli>=2.0; python_version < '3.11'",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.9",
    "ruff>=0.4",
]

[project.scripts]
dll-injector = "dll_injector.bootstrap.cli:main"

[tool.setuptools.packages.find]
include = ["dll_injector*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=dll_injector --cov-report=term-missing"